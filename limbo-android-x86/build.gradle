apply plugin: 'com.android.application'

android {
    compileSdkVersion 31

    defaultConfig {
        applicationId "com.limbo.emu.dontknowhy"
        minSdk 29
        targetSdkVersion 29
        ndk { abiFilters "arm64-v8a" }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
    namespace 'com.limbo.emu.dontknowhy'

    // Native libraries are stored uncompressed and are 16 KB page aligned by
    // scripts/package-apk.sh (zipalign -P 16) before signing, so Android 15+
    // does not warn about misaligned .so files.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    lint {
        abortOnError false
        disable 'MissingTranslation'
    }

}

dependencies {
//    implementation fileTree(include: ['*.jar,*.so'], dir: 'libs')
    implementation fileTree(dir: 'libs', include: ['.jar','.so'])

    implementation 'androidx.appcompat:appcompat:1.3.0'

    implementation project(':limbo-android-lib')
}
