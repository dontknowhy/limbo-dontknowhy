# Build the Limbo (QEMU 11.1.3) arm64-v8a APK on GitHub Actions.
#
# 依赖（tarball + 解压后的源码）现在统一放在仓库的 jni/ 目录里，缓存命中时
# 下载、解压、打补丁、交叉编译依赖都可以跳过。
#
# 签名材料通过 secrets 传入，落到 $LIMBO_ROOT/keystore/（与 scripts/env.sh 的
# 默认布局一致），package-apk.sh 会照常读取。推荐只配一个：
#   KEYSTORE_BUNDLE_BASE64   ../keystore 整个目录的 base64 tar.gz，生成方式：
#       tar -czf - -C ../keystore limbo-release.jks keystore.properties | base64 -w0
# 也可以拆成四项（缺一不可）：
#   KEYSTORE_BASE64          limbo-release.jks 的 base64
#   KEYSTORE_PASSWORD        storePassword
#   KEY_ALIAS                keyAlias（通常就是 limbo）
#   KEY_PASSWORD             keyPassword
# 两者都没配时自动退回 debug 签名，方便先把流程跑通。
#
# 打 v* tag 时额外创建 GitHub Release；也可以在 Actions 页面手动触发。
name: Build APK

on:
  workflow_dispatch:
    inputs:
      debug:
        description: Build a debug-signed APK instead of a signed release
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # 保持和 README.developers 一样的工作区布局：仓库检出到子目录，build/ 与
  # prebuilt/ 放在它旁边，避免和 Gradle 的根 build/ 目录混在一起。
  LIMBO_ROOT: ${{ github.workspace }}
  DEPS: ${{ github.workspace }}/limbo-dontknowhy/limbo-android-lib/src/main/jni
  BUILD: ${{ github.workspace }}/build
  PREFIX: ${{ github.workspace }}/prebuilt/arm64-v8a
  NDK_VERSION: 30.0.16248370
  # 缓存内容：依赖 tarball + 解压树 + 已安装的 $PREFIX + 各依赖的 meson/cmake
  # 构建目录。故意不含 build/qemu-build：全量 LTO 的中间产物太大，会撑爆
  # GitHub 10 GB 的仓库缓存上限。
  NATIVE_CACHE_PATHS: |
    build/.stamps
    build/config-meson.cross
    build/setjmp
    build/toolchain-prefix
    build/zlib-ng-build
    build/pcre2-build
    build/libiconv-build
    build/libffi-build
    build/glib-build
    build/pixman-build
    build/slirp-build
    build/sdl2-build
    prebuilt
    limbo-dontknowhy/limbo-android-lib/src/main/jni/*.tar.*
    limbo-dontknowhy/limbo-android-lib/src/main/jni/qemu
    limbo-dontknowhy/limbo-android-lib/src/main/jni/glib
    limbo-dontknowhy/limbo-android-lib/src/main/jni/pixman
    limbo-dontknowhy/limbo-android-lib/src/main/jni/SDL2
    limbo-dontknowhy/limbo-android-lib/src/main/jni/libffi
    limbo-dontknowhy/limbo-android-lib/src/main/jni/zlib-ng-2.3.3
    limbo-dontknowhy/limbo-android-lib/src/main/jni/zstd-1.5.7
    limbo-dontknowhy/limbo-android-lib/src/main/jni/pcre2-10.49
    limbo-dontknowhy/limbo-android-lib/src/main/jni/libiconv-1.18
    limbo-dontknowhy/limbo-android-lib/src/main/jni/libslirp-4.9.7

jobs:
  build:
    name: Native + APK
    # 全量 LTO 的 QEMU 在 4 核 runner 上大约 1.5–3 小时。
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      apk: ${{ steps.verify.outputs.apk }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: limbo-dontknowhy
          fetch-depth: 1

      - name: Free disk space and add swap
        run: |
          set -euxo pipefail
          # runner 镜像自带的 NDK / system image / 其它语言工具我们不用。
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
                      /usr/local/lib/android/sdk/system-images \
                      /usr/share/dotnet /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          # QEMU 全量 LTO 链接的内存峰值不低，加 8 GB swap 兜底。
          sudo fallocate -l 8G /mnt/limbo-swap || \
            sudo dd if=/dev/zero of=/mnt/limbo-swap bs=1M count=8192 status=none
          sudo chmod 600 /mnt/limbo-swap
          sudo mkswap /mnt/limbo-swap >/dev/null
          sudo swapon /mnt/limbo-swap
          df -h / /mnt
          free -h

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install host build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool-bin pkg-config flex bison gettext \
            cmake ninja-build patchelf curl zip unzip
          python3 -m pip install --upgrade pip
          python3 -m pip install meson
          cmake --version | head -1
          meson --version
          ninja --version
          patchelf --version

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-31 build-tools;35.0.0 ndk;${{ env.NDK_VERSION }}'

      - name: Point env.sh at the installed NDK
        run: |
          set -euxo pipefail
          # env.sh 用 NDK_ROOT；setup-android 已经导出 ANDROID_SDK_ROOT。
          echo "NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          test -x "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2.1'
          # 用 GitHub Actions 自带的缓存，不依赖 Gradle 的商业缓存服务。
          cache-provider: basic
          # tag 构建默认会被当成非默认分支而只读，这里强制允许写缓存。
          cache-read-only: false

      - name: Point the build at the installed Gradle
        run: |
          set -euxo pipefail
          # env.sh 的默认值是 $LIMBO_ROOT/gradle-8.2.1/bin/gradle，这里改成
          # setup-gradle 放到 PATH 上的那一份。
          echo "GRADLE=$(command -v gradle)" >> "$GITHUB_ENV"
          gradle --version

      - name: Restore native build cache
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.NATIVE_CACHE_PATHS }}
          # 补丁或构建脚本一变就换 key，避免把旧 QEMU 树/旧 stamp 套到新补丁上。
          key: native-${{ hashFiles('limbo-dontknowhy/Makefile', 'limbo-dontknowhy/scripts/**', 'limbo-dontknowhy/limbo-android-lib/src/main/jni/patches/qemu-11.1.3/*.patch') }}

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BUNDLE_BASE64: ${{ secrets.KEYSTORE_BUNDLE_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          WANT_DEBUG: ${{ inputs.debug }}
        run: |
          set -euo pipefail
          MODE=release
          if [ "${WANT_DEBUG:-false}" = "true" ]; then
            MODE=debug
          fi
          if [ "$MODE" = release ] &&
             [ -z "${KEYSTORE_BUNDLE_BASE64:-}" ] &&
             [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning title=未配置签名 secret::KEYSTORE_BUNDLE_BASE64 为空，改为构建 debug APK"
            MODE=debug
          fi
          if [ "$MODE" = release ]; then
            mkdir -p "$LIMBO_ROOT/keystore"
            if [ -n "${KEYSTORE_BUNDLE_BASE64:-}" ]; then
              # 整个 keystore 目录（jks + keystore.properties）打成一个 tar.gz。
              printf '%s' "$KEYSTORE_BUNDLE_BASE64" | base64 -d |
                tar -xzf - -C "$LIMBO_ROOT/keystore"
            else
              printf '%s' "$KEYSTORE_BASE64" | base64 -d \
                > "$LIMBO_ROOT/keystore/limbo-release.jks"
              # package-apk.sh 会 source 这个文件：值里不要带空格、引号、$ 等
              # shell 元字符，否则会被 shell 展开。
              {
                echo "keyAlias=${KEY_ALIAS}"
                echo "storePassword=${KEYSTORE_PASSWORD}"
                echo "keyPassword=${KEY_PASSWORD}"
              } > "$LIMBO_ROOT/keystore/keystore.properties"
            fi
            chmod 600 "$LIMBO_ROOT/keystore"/*
            # 缺任何一个都说明 secret 内容不对，早点失败。
            test -f "$LIMBO_ROOT/keystore/limbo-release.jks"
            test -f "$LIMBO_ROOT/keystore/keystore.properties"
            echo "signing key written to $LIMBO_ROOT/keystore/"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = release ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build native libraries and APK
        env:
          MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euxo pipefail
          cd limbo-dontknowhy
          make deps-fetch
          if [ "$MODE" = release ]; then
            make apk JOBS="$(nproc)"
          else
            make apk-debug JOBS="$(nproc)"
          fi

      - name: Verify APK
        id: verify
        env:
          MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          cd limbo-dontknowhy
          # shellcheck disable=SC1091
          source scripts/env.sh
          APK="$BUILD/limbo-x86-qemu11-arm64-${MODE}.apk"
          test -f "$APK"
          # 16 KB 页对齐 + 签名校验（debug APK 用 Gradle 的 debug key）。
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          # 先落盘再 grep：pipefail 下 `unzip -l | grep -q` 会因 SIGPIPE 误报失败。
          unzip -l "$APK" > /tmp/apk-entries.txt
          grep -q 'lib/arm64-v8a/libqemu-system-x86_64\.so' /tmp/apk-entries.txt
          grep -q 'lib/arm64-v8a/liblimbo\.so' /tmp/apk-entries.txt
          sha256sum "$APK" | tee "$APK.sha256"
          echo "apk=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          {
            echo "### $(basename "$APK")"
            echo
            echo '```'
            ls -l "$APK"
            cat "$APK.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: limbo-apk
          path: |
            build/*.apk
            build/*.apk.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Save native build cache
        # 只有构建成功才写缓存，避免把半成品 QEMU 树/stamp 存进去。
        if: success() && steps.native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.NATIVE_CACHE_PATHS }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: limbo-apk
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: Limbo ${{ github.ref_name }}
          files: |
            dist/*.apk
            dist/*.apk.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
